services:
  redis:
    image: redis:7.4-alpine
    container_name: rankrush-redis
    # Giới hạn RAM 500MB + chính sách allkeys-lru: khi đầy bộ nhớ,
    # Redis tự động loại key ít dùng nhất thay vì sập hoặc từ chối ghi.
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 500mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - rankrush_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redisinsight:
    # RedisInsight 3.x images are not executable on this Docker Desktop setup.
    # This stable 2.x image runs correctly on the current amd64 engine.
    image: redislabs/redisinsight:2.70.1
    container_name: rankrush-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  rankrush_redis_data:
